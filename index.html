<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Portfolio DNMADE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="img/logo perso.png" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Marine Up', sans-serif;
      background: #ffffff; /* fond blanc */
      overflow: hidden;
      color: #000000; /* texte noir */
    }

    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      z-index: 1000;
      transition: opacity 0.5s ease-out;
    }

    .loading-container.fade-out {
      opacity: 0;
    }

    .loading-video {
      max-width: 60vw;
      max-height: 40vh;
      width: auto;
      height: auto;
    }

    @media (max-width: 768px) {
      .loading-video {
        max-width: 80vw;
        max-height: 30vh;
      }
    }

    .main-content {
      display: none;
      height: 100%;
      background: #ffffff; /* fond blanc */
      color: #000000; /* texte noir */
      overflow-x: hidden;
      position: relative;
    }

    .main-content.show {
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      background: #ffffff; /* fond blanc */
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
      height: 90px;
      overflow: hidden;
    }

    header::before {
      content: none; /* supprime le flou et transparence */
    }

    header .logo {
      font-weight: 500;
      font-size: 1.6rem;
      letter-spacing: 1.5px;
    }

    header .logo img {
      height: 50px;
      width: auto;
      display: block;
    }

    nav a {
      color: #000000; /* liens noirs */
      margin-left: 30px;
      text-decoration: none;
      font-weight: 300;
      position: relative;
      transition: color 0.3s ease;
      display: inline-block;
    }

    nav a:hover {
      color: #000000;
    }

    /* ========== IMAGE À GAUCHE DU LIEN "À PROPOS" ========== */
    nav a[href="apropos.html"] {
      position: relative;
      padding-left: 40px; /* espace pour l'image */
    }

    nav a[href="apropos.html"]::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      width: 35px; /* image plus petite */
      height: 35px;
      background-image: url('img/aproposcoté.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    main {
      flex: 1;
      position: relative;
      z-index: 1;
    }

    .hero-wrapper {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 20px;
      text-align: center;
    }

    .hero {
      max-width: 620px;
      transition: color 0.3s ease;
    }

    /* petite flèche qui invite à scroller, sous le HEY ! */
    .scroll-hint {
      margin-top: 60px;
      font-family: 'Courier New', ui-monospace, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.45;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      animation: bounce 2s ease-in-out infinite;
    }

    .scroll-hint svg {
      width: 16px;
      height: 16px;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .scroll-hint {
        animation: none;
      }
    }

    /* deuxième écran : le choix des univers */
    .tracker-section {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 20px;
    }

    .hero h1 {
      font-size: 3.2rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: #000000;
    }

    .hero h2 {
      font-size: 1.8rem;
      font-weight: 400;
      margin-bottom: 12px;
      color: #000000;
    }

    .hero p {
      font-size: 1.1rem;
      color: #000000;
    }

    .detect-zone.touching h1,
    .detect-zone.touching h2,
    .detect-zone.touching p {
      color: #000000 !important;
      background: none !important;
      -webkit-text-fill-color: #000000 !important;
      filter: none !important;
    }

    /* ================================================
       TRACKER — patch de nodes façon TouchDesigner
       ================================================ */
    .tracker-wrap {
      position: relative;
      padding-top: 10px;
    }

    /* le point d'où partent tous les câbles, juste sous le "HEY !" */
    .tracker-hub {
      width: 8px;
      height: 8px;
      background: #000000;
      border-radius: 50%;
      margin: 0 auto;
    }

    .tracker-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .tracker-svg path.connector {
      fill: none;
      stroke: #000000;
      stroke-width: 1.2;
      stroke-dasharray: 3 5;
      opacity: 0.45;
    }

    .tracker-svg path.connector-signal {
      fill: #000000;
      opacity: 0.75;
    }

    @media (prefers-reduced-motion: reduce) {
      .tracker-svg path.connector-signal {
        display: none;
      }
    }

    .tracker {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 22px;
      margin-top: 40px;
    }

    /* décalages façon carte mentale — pas alignés en rangée droite */
    .tracker-item:nth-child(1) { margin-top: 4px; }   /* Motion design — haut */
    .tracker-item:nth-child(2) { margin-top: 74px; }  /* UX/UI — milieu */
    .tracker-item:nth-child(3) { margin-top: 140px; } /* TouchDesigner — bas */
    .tracker-item:nth-child(4) { margin-top: 140px; } /* 3D — bas, parallèle à TouchDesigner */
    .tracker-item:nth-child(5) { margin-top: 4px; }   /* Identité — haut, parallèle à Motion design */

    .tracker-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 12px 18px;
      border: 1px solid #000000;
      border-radius: 2px;
      background: #ffffff;
      color: #000000;
      text-decoration: none;
      font-weight: 400;
      font-size: 0.92rem;
      letter-spacing: 0.02em;
      transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    /* petit plot en haut du node, comme une entrée TouchDesigner */
    .tracker-item::before {
      content: '';
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      background: #ffffff;
      border: 1px solid #000000;
      border-radius: 50%;
      transition: background 0.18s ease;
    }

    .tracker-item:hover::before,
    .tracker-item:focus-visible::before {
      background: #000000;
    }

    .tracker-item__index {
      font-family: 'Courier New', ui-monospace, monospace;
      font-size: 0.72rem;
      opacity: 0.55;
    }

    .tracker-item:hover,
    .tracker-item:focus-visible {
      background: #000000;
      color: #ffffff;
      transform: translateY(-3px);
    }

    .tracker-item:hover .tracker-item__index,
    .tracker-item:focus-visible .tracker-item__index {
      opacity: 0.75;
    }

    .tracker-item:focus-visible {
      outline: 2px solid #000000;
      outline-offset: 4px;
    }

    /* petite indication au-dessus du tracker */
    .tracker-hint {
      margin-top: 0;
      padding-top: 14px;
      font-family: 'Courier New', ui-monospace, monospace;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.4;
    }

    @media (max-width: 768px) {
      .tracker-wrap {
        margin-top: 40px;
      }
      .tracker {
        gap: 14px;
        margin-top: 30px;
      }
      .tracker-item {
        padding: 10px 14px;
        font-size: 0.82rem;
      }
      .tracker-item:nth-child(1),
      .tracker-item:nth-child(2),
      .tracker-item:nth-child(3),
      .tracker-item:nth-child(4),
      .tracker-item:nth-child(5) {
        margin-top: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .tracker-item {
        transition: none;
      }
    }

    footer {
      background: transparent;
      padding: 40px 0 10px 0;
      text-align: center;
      font-size: 0.9rem;
      color: #000000;
      font-weight: 300;
      z-index: 2;
      position: relative;
      line-height: 1.8;
    }

    .footer-content {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: nowrap;
      flex-direction: row;
      margin-bottom: 10px;
    }

    .contact-item {
      margin-bottom: 0;
      font-size: 1rem;
    }

    .contact-item a {
      color: #000000;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .contact-item a:hover {
      color: #000000;
    }

    .footer-bottom {
      font-size: 0.8rem;
      color: #000000;
    }

    ::-webkit-scrollbar {
      display: none;
    }

    html {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* ========= BULLES PAC-MAN ========= */
    .floating-bubble {
      width: 110px;
      height: 110px;
      background: #000000; /* bulles noires */
      position: absolute;
      animation: float 8s ease-in-out infinite;
      cursor: grab;
      z-index: 5;
      touch-action: none;
      border-radius: 50%;
      clip-path: polygon(
        50% 50%,
        100% 0%,
        100% 100%,
        0% 100%,
        0% 0%
      );
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-30px); }
      100% { transform: translateY(0px); }
    }

    @media (max-width: 768px) {
      .hero h1 { font-size: 2rem; }
      .hero h2 { font-size: 1.4rem; }
      .hero p { font-size: 1rem; }

      .floating-bubble {
        width: 80px;
        height: 80px;
      }

      header {
        padding: 15px 20px;
        height: 70px;
      }

      header .logo img {
        height: 40px;
      }

      nav a {
        margin-left: 20px;
        font-size: 0.9rem;
      }

      nav a[href="apropos.html"]::before {
        width: 30px;
        height: 30px;
      }

      nav a[href="apropos.html"] {
        padding-left: 35px;
      }

      footer .contact-item {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <div class="loading-container" id="loadingContainer">
    <video class="loading-video" id="loadingVideo" autoplay muted>
      <source src="img/logositetest.mp4" type="video/mp4" />
      Votre navigateur ne supporte pas la lecture de vidéos.
    </video>
  </div>

  <div class="main-content" id="mainContent">
    <header>
      <div class="logo">
        <img src="img/logo insta.png" alt="Logo" />
      </div>
      <nav>
        <a href="apropos.html">À propos</a>
        <a href="projet2.html">Projets</a>
      </nav>
    </header>

    <main>
      <section class="hero-wrapper" id="hero">
        <div class="hero detect-zone">
          <h1>HEY !</h1>
          <div class="scroll-hint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M12 4v16m0 0l-6-6m6 6l6-6" />
            </svg>
          </div>
        </div>
      </section>

      <section class="tracker-section" id="trackerSection">
        <!-- TRACKER : patch de nodes façon TouchDesigner -->
        <div class="tracker-wrap" id="trackerWrap">
          <div class="tracker-hub" id="trackerHub"></div>
          <svg class="tracker-svg" id="trackerSvg">
            <defs>
              <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                <path d="M0,0 L6,3 L0,6 Z" fill="#000000" opacity="0.55"></path>
              </marker>
            </defs>
          </svg>

          <nav class="tracker" id="trackerNodes" aria-label="Catégories de projets">
            <a class="tracker-item" href="projet2.html#motion">
              <span>Motion design</span>
            </a>
            <a class="tracker-item" href="projet2.html#uxui">
              <span>UX / UI</span>
            </a>
            <a class="tracker-item" href="projet2.html#touchdesigner">
              <span>TouchDesigner</span>
            </a>
            <a class="tracker-item" href="projet2.html#3d">
              <span>3D</span>
            </a>
            <a class="tracker-item" href="projet2.html#identite">
              <span>Identité</span>
            </a>
          </nav>

          <p class="tracker-hint">// choisis un univers</p>
        </div>
      </section>
    </main>

    <footer id="contact">
      <div class="footer-content">
        <div class="contact-item">
          <a href="mailto:alyssia.mattioni@gmail.com">alyssia.mattioni@gmail.com</a>
        </div>
        <div class="contact-item">
          <a href="tel:+33613662129">06 13 66 21 29</a>
        </div>
      </div>
      <div class="footer-bottom">
        © 2025 Alyssia Mattioni
      </div>
    </footer>

    <!-- Bulles Pac-Man -->
    <div class="floating-bubble" style="top: 10%; left: 14%; animation-delay: 0s; transform: rotate(30deg);"></div>
    <div class="floating-bubble" style="top: 25%; left: 42%; animation-delay: 1.2s; transform: rotate(90deg);"></div>
    <div class="floating-bubble" style="top: 38%; left: 68%; animation-delay: 2.4s; transform: rotate(150deg);"></div>
    <div class="floating-bubble" style="top: 52%; left: 20%; animation-delay: 3.1s; transform: rotate(210deg);"></div>
    <div class="floating-bubble" style="top: 65%; left: 58%; animation-delay: 0.7s; transform: rotate(270deg);"></div>
    <div class="floating-bubble" style="top: 75%; left: 70%; animation-delay: 2.9s; transform: rotate(330deg);"></div>
    <div class="floating-bubble" style="top: 82%; left: 36%; animation-delay: 1.6s; transform: rotate(60deg);"></div>
    <div class="floating-bubble" style="top: 90%; left: 14%; animation-delay: 0.3s; transform: rotate(120deg);"></div>

  </div>

  <script>
    const loadingContainer = document.getElementById('loadingContainer');
    const loadingVideo = document.getElementById('loadingVideo');
    const mainContent = document.getElementById('mainContent');

    function redirectToMain() {
      loadingContainer.classList.add('fade-out');
      setTimeout(() => {
        loadingContainer.style.display = 'none';
        mainContent.classList.add('show');
        document.body.style.overflow = 'auto';
        initMainPage();
      }, 500);
    }

    // Trace les câbles entre le hub et chaque node, comme dans un patch TouchDesigner
    function drawTrackerConnectors() {
      const wrap = document.getElementById('trackerWrap');
      const hub = document.getElementById('trackerHub');
      const svg = document.getElementById('trackerSvg');
      const nodes = document.querySelectorAll('.tracker-item');
      if (!wrap || !hub || !svg || !nodes.length) return;

      // nettoie les anciens tracés (garde les <defs>)
      svg.querySelectorAll('path.connector, path.connector-signal').forEach((p) => p.remove());

      const wrapRect = wrap.getBoundingClientRect();
      const hubRect = hub.getBoundingClientRect();
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const svgNS = 'http://www.w3.org/2000/svg';

      const hubX = hubRect.left + hubRect.width / 2 - wrapRect.left;
      const hubY = hubRect.top + hubRect.height / 2 - wrapRect.top;

      nodes.forEach((node, i) => {
        const nodeRect = node.getBoundingClientRect();
        const nodeX = nodeRect.left + nodeRect.width / 2 - wrapRect.left;
        const nodeY = nodeRect.top - wrapRect.top - 6; // s'arrête juste avant le plot du node

        const midY = hubY + (nodeY - hubY) * 0.55;

        const d = `M ${hubX} ${hubY} L ${hubX} ${midY} L ${nodeX} ${midY} L ${nodeX} ${nodeY}`;

        const path = document.createElementNS(svgNS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('class', 'connector');
        path.setAttribute('marker-end', 'url(#arrowHead)');
        svg.appendChild(path);

        // petite pointe qui voyage le long du câble, comme un signal TouchDesigner
        if (!reduceMotion) {
          const signal = document.createElementNS(svgNS, 'path');
          signal.setAttribute('d', 'M -3,-2.5 L 4,0 L -3,2.5 Z');
          signal.setAttribute('class', 'connector-signal');

          const anim = document.createElementNS(svgNS, 'animateMotion');
          anim.setAttribute('dur', '1.8s');
          anim.setAttribute('begin', `${i * 0.25}s`);
          anim.setAttribute('repeatCount', 'indefinite');
          anim.setAttribute('rotate', 'auto');
          anim.setAttribute('path', d);
          signal.appendChild(anim);

          svg.appendChild(signal);
        }
      });
    }

    let trackerResizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(trackerResizeTimeout);
      trackerResizeTimeout = setTimeout(drawTrackerConnectors, 100);
    });

    function initMainPage() {
      // dessine les câbles une fois le contenu affiché et mis en page
      requestAnimationFrame(() => requestAnimationFrame(drawTrackerConnectors));

      const bubbles = document.querySelectorAll('.floating-bubble');
      const detectZone = document.querySelector('.detect-zone');
      let dragging = null;
      let offsetX = 0;
      let offsetY = 0;

      function checkCollision(bubble, zone) {
        const bRect = bubble.getBoundingClientRect();
        const zRect = zone.getBoundingClientRect();
        return !(
          bRect.right < zRect.left ||
          bRect.left > zRect.right ||
          bRect.bottom < zRect.top ||
          bRect.top > zRect.bottom
        );
      }

      function updateTextOnContact() {
        let isTouching = false;
        bubbles.forEach(bubble => {
          if (checkCollision(bubble, detectZone)) {
            isTouching = true;
          }
        });

        detectZone.classList.toggle('touching', isTouching);
        requestAnimationFrame(updateTextOnContact);
      }
      updateTextOnContact();

      function resumeFloating(bubble) {
        bubble.style.animation = 'none';
        void bubble.offsetWidth;
        bubble.style.animation = 'float 8s ease-in-out infinite';
      }

      bubbles.forEach(bubble => {
        bubble.addEventListener('mousedown', (e) => {
          dragging = bubble;
          offsetX = e.clientX - bubble.offsetLeft;
          offsetY = e.clientY - bubble.offsetTop;
          bubble.style.animation = 'none';
        });

        bubble.addEventListener('touchstart', (e) => {
          e.preventDefault();
          dragging = bubble;
          const touch = e.touches[0];
          offsetX = touch.clientX - bubble.offsetLeft;
          offsetY = touch.clientY - bubble.offsetTop;
          bubble.style.animation = 'none';
        });
      });

      document.addEventListener('mousemove', (e) => {
        if (dragging) {
          dragging.style.left = `${e.clientX - offsetX}px`;
          dragging.style.top = `${e.clientY - offsetY}px`;
        }
      });

      document.addEventListener('mouseup', () => {
        if (dragging) {
          resumeFloating(dragging);
          dragging = null;
        }
      });

      document.addEventListener('touchmove', (e) => {
        if (dragging) {
          const touch = e.touches[0];
          dragging.style.left = `${touch.clientX - offsetX}px`;
          dragging.style.top = `${touch.clientY - offsetY}px`;
        }
      });

      document.addEventListener('touchend', () => {
        if (dragging) {
          resumeFloating(dragging);
          dragging = null;
        }
      });
    }

    loadingVideo.addEventListener('ended', redirectToMain);
    // si la vidéo ne trouve pas son fichier (pas encore uploadé), on saute direct
    loadingVideo.addEventListener('error', redirectToMain);

    setTimeout(() => {
      if (!mainContent.classList.contains('show')) {
        redirectToMain();
      }
    }, 8000);
  </script>
</body>
</html>
