<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>À propos — Alyssia Mattioni</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="img/logo perso.png" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    background:#ffffff;
    color:#000000;
    font-family:'Montserrat', sans-serif;
    overflow-x:hidden;
  }
  ::-webkit-scrollbar{ display:none; }
  html{ -ms-overflow-style:none; scrollbar-width:none; }

  /* ---- header minimal : retour + burger ---- */
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 34px 44px 0;
    position:relative;
    z-index:60;
  }

  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    border: 1px solid #000000;
    border-radius: 999px;
    padding: 8px 18px 8px 14px;
    font-weight:500;
    font-size:0.85rem;
    letter-spacing:0.03em;
    cursor:pointer;
    text-decoration:none;
    color:#000000;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .back-btn:hover{ background:#000000; color:#ffffff; }
  .back-btn svg{ width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2; }

  .burger{
    display:flex;
    flex-direction:column;
    gap:6px;
    cursor:pointer;
    padding:8px;
    background:none;
    border:none;
  }
  .burger span{
    width:26px;
    height:1.5px;
    background:#000000;
    display:block;
    transform-origin: center;
    transition: transform 0.3s ease, opacity 0.3s ease, background 0.3s ease;
  }
  .burger.open span{ background:#ffffff; }
  .burger.open span:nth-child(1){ transform: translateY(7.5px) rotate(45deg); }
  .burger.open span:nth-child(2){ opacity:0; }
  .burger.open span:nth-child(3){ transform: translateY(-7.5px) rotate(-45deg); }

  /* ---- menu overlay : fond noir, texte blanc quand ouvert ---- */
  .nav-overlay{
    position:fixed;
    inset:0;
    background:#000000;
    z-index:50;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:30px;
    transform: translateY(-100%);
    transition: transform 0.45s cubic-bezier(.4,.05,.2,1);
    overflow:hidden;
  }
  .nav-overlay.open{ transform: translateY(0); }

  /* motif organique repris tel quel de la page d'accueil, en blanc sur fond noir */
  .nav-motif-svg{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    opacity:0;
    transition: opacity 0.6s ease 0.1s;
  }
  .nav-overlay.open .nav-motif-svg{ opacity:1; }
  .nav-motif-svg path{ fill:none; stroke:#ffffff; }
  .nav-motif-svg circle{ fill:none; stroke:#ffffff; }
  .nav-motif-svg .is-dot{ fill:#ffffff; stroke:none; }

  .nav-links{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:26px;
  }

  .nav-overlay a{
    position:relative;
    font-size:2.2rem;
    font-weight:500;
    color:#ffffff;
    text-decoration:none;
    letter-spacing:1px;
    opacity:0;
    transform: translateY(14px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .nav-overlay.open a{ opacity:1; transform: translateY(0); }
  .nav-overlay.open a:nth-child(1){ transition-delay: 0.12s; }
  .nav-overlay.open a:nth-child(2){ transition-delay: 0.18s; }
  .nav-overlay.open a:nth-child(3){ transition-delay: 0.24s; }
  .nav-overlay a:hover{ text-decoration:underline; text-underline-offset:5px; }

  /* ---- titre + logo ---- */
  .title-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding: 60px 44px 0;
  }

  h1{
    font-size: clamp(2.8rem, 6vw, 4.4rem);
    font-weight:600;
    letter-spacing:0px;
    line-height:1;
  }

  .mark-icon{
    width: 64px; height:64px;
    flex-shrink:0;
    margin-top: 10px;
  }
  .mark-icon svg{ width:100%; height:100%; }

  /* ---- corps : vidéo motif + rows d'infos ---- */
  .body-grid{
    display:grid;
    grid-template-columns: 240px 1fr;
    gap: 40px;
    padding: 100px 44px 0;
    align-items:start;
  }

  .motif-panel{
    position:relative;
    aspect-ratio: 4/3;
    overflow:hidden;
    border-radius:1px;
  }
  .motif-panel video{
    width:100%;
    height:100%;
    object-fit: cover;
    display:block;
  }

  .info-rows{ display:flex; flex-direction:column; }

  .info-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap: 20px;
    padding: 20px 0;
    border-bottom: 1px solid #000000;
    text-decoration:none;
    color:#000000;
  }
  .info-row:first-child{ border-top: 1px solid #000000; }

  .info-label{
    font-size:0.82rem;
    font-weight:600;
    letter-spacing:0.08em;
    flex-shrink:0;
  }
  .info-value{
    font-size:0.95rem;
    font-weight:400;
    text-align:right;
    letter-spacing:0.02em;
    transition: opacity 0.2s ease;
  }
  a.info-row:hover .info-value{ opacity:0.5; }

  .copy-row{ cursor:pointer; }
  .copy-row .info-value{ display:flex; align-items:center; gap:10px; }
  .copy-row:hover .info-value{ opacity:0.5; }
  .copy-row svg{ width:15px; height:15px; stroke:#000000; fill:none; stroke-width:1.6; flex-shrink:0; }
  .copy-feedback{
    font-family:'Courier New', ui-monospace, monospace;
    font-size:0.68rem;
    letter-spacing:0.05em;
    text-transform:uppercase;
    opacity:0;
    transition: opacity 0.2s ease;
  }
  .copy-feedback.visible{ opacity:0.6; }

  /* ---- réseaux ---- */
  .socials{
    margin-top: 64px;
    display:flex;
    gap: 60px;
    flex-wrap:wrap;
    align-items:center;
  }
  .social-col{
    display:flex;
    flex-direction:column;
    gap: 8px;
  }
  .social-col a,
  .social-col .social-copy{
    font-size:0.95rem;
    color:#000000;
    text-decoration:none;
    cursor:pointer;
    background:none;
    border:none;
    font-family:'Montserrat', sans-serif;
    padding:0;
    text-align:left;
  }
  .social-col a:hover,
  .social-col .social-copy:hover{ text-decoration:underline; }

  .copyright{
    margin-left:auto;
    font-size:0.85rem;
    opacity:0.6;
  }

  footer{ height: 60px; }

  /* ---- responsive ---- */
  @media (max-width: 820px){
    header{ padding: 26px 22px 0; }
    .title-row{ padding: 40px 22px 0; }
    h1{ font-size: 2.2rem; letter-spacing:0.5px; }
    .mark-icon{ width:40px; height:40px; margin-top:6px; }
    .body-grid{
      grid-template-columns: 1fr;
      padding: 40px 22px 0;
      gap: 28px;
    }
    .motif-panel{ aspect-ratio: 16/9; max-width: 100%; }
    .socials{ gap:32px; margin-top:48px; }
    .copyright{ margin-left:0; margin-top:20px; width:100%; }
  }
</style>
</head>

<script>
  const burger = document.getElementById('burgerBtn');

  // ---- motif organique, repris tel quel de la page d'accueil ----
  function drawOrganicMotif(svgId, W, H, opts) {
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.getElementById(svgId);
    if (!svg) return;
    svg.innerHTML = '';
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const STRANDS = opts.strands;
    const BUBBLES = opts.bubbles;
    const convergeY = opts.convergeY;
    const convergeStrength = opts.convergeStrength;

    const signalStrands = new Set();
    for (let s = 0; s < STRANDS; s++) {
      if (s % 3 === 1) signalStrands.add(s);
    }

    for (let s = 0; s < STRANDS; s++) {
      let x = -10;
      let y = 15 + Math.random() * (H - 30);
      let angle = 0;
      const points = [`M${x.toFixed(1)},${y.toFixed(1)}`];

      while (x < W + 10) {
        const stepLen = 14 + Math.random() * 10;
        angle += (Math.random() - 0.5) * 0.8;
        angle = Math.max(-1.1, Math.min(1.1, angle));
        x += Math.cos(angle) * stepLen;
        y += Math.sin(angle) * stepLen;
        y = Math.max(6, Math.min(H - 6, y));

        const pull = Math.exp(-((x - W / 2) ** 2) / (W * 43)) * convergeStrength;
        y = y * (1 - pull) + convergeY * pull;

        points.push(`L${x.toFixed(1)},${y.toFixed(1)}`);
      }

      const d = points.join(' ');
      const path = document.createElementNS(svgNS, 'path');
      path.setAttribute('d', d);
      path.setAttribute('stroke-width', (0.55 + Math.random() * 0.25).toFixed(2));
      path.setAttribute('opacity', (0.85 + Math.random() * 0.15).toFixed(2));
      if (signalStrands.has(s)) path.setAttribute('stroke-dasharray', '2.5 4');
      svg.appendChild(path);

      if (signalStrands.has(s) && !reduceMotion) {
        const signal = document.createElementNS(svgNS, 'path');
        signal.setAttribute('d', 'M0,0 L1.9,-2.3 A3,3 0 1,0 1.9,2.3 Z');
        signal.setAttribute('class', 'is-dot');
        signal.setAttribute('opacity', '0.85');
        const anim = document.createElementNS(svgNS, 'animateMotion');
        anim.setAttribute('dur', `${3.5 + Math.random()}s`);
        anim.setAttribute('repeatCount', 'indefinite');
        anim.setAttribute('rotate', 'auto');
        anim.setAttribute('path', d);
        signal.appendChild(anim);
        svg.appendChild(signal);
      }
    }

    for (let i = 0; i < BUBBLES; i++) {
      const cx = Math.random() * W;
      let cy = 8 + Math.random() * (H - 16);
      const pull = Math.exp(-((cx - W / 2) ** 2) / (W * 43)) * (convergeStrength * 0.8);
      cy = cy * (1 - pull) + convergeY * pull;
      const r = opts.pacman ? 4 + Math.random() * 11 : 1.5 + Math.random() * 9;
      const isDot = Math.random() < (opts.pacman ? 0.6 : 0.3);

      if (opts.pacman && isDot) {
        const facing = Math.random() * Math.PI * 2;
        const mouth = (40 + Math.random() * 15) * (Math.PI / 180);
        const a1 = facing - mouth;
        const a2 = facing + mouth;
        const p1x = cx + Math.cos(a1) * r;
        const p1y = cy + Math.sin(a1) * r;
        const p2x = cx + Math.cos(a2) * r;
        const p2y = cy + Math.sin(a2) * r;
        const pac = document.createElementNS(svgNS, 'path');
        pac.setAttribute('d', `M${cx.toFixed(1)},${cy.toFixed(1)} L${p1x.toFixed(1)},${p1y.toFixed(1)} A${r.toFixed(1)},${r.toFixed(1)} 0 1,0 ${p2x.toFixed(1)},${p2y.toFixed(1)} Z`);
        pac.setAttribute('class', 'is-dot');
        pac.setAttribute('opacity', (0.88 + Math.random() * 0.12).toFixed(2));
        svg.appendChild(pac);
        continue;
      }

      const circle = document.createElementNS(svgNS, 'circle');
      circle.setAttribute('cx', cx.toFixed(1));
      circle.setAttribute('cy', cy.toFixed(1));
      circle.setAttribute('r', r.toFixed(1));
      circle.setAttribute('stroke-width', isDot ? '0' : (0.55 + Math.random() * 0.3).toFixed(2));
      circle.setAttribute('opacity', (0.8 + Math.random() * 0.2).toFixed(2));
      if (isDot) circle.setAttribute('class', 'is-dot');
      svg.appendChild(circle);
    }
  }

  function generateNavMotif() {
    const W = Math.max(280, window.innerWidth);
    const H = Math.max(260, window.innerHeight);
    drawOrganicMotif('navMotif', W, H, {
      strands: 7,
      bubbles: 18,
      convergeY: H * 0.5,
      convergeStrength: 0.2,
      pacman: true,
    });
  }

  burger.addEventListener('click', () => {
    burger.classList.toggle('open');
    overlay.classList.toggle('open');
    if (overlay.classList.contains('open')) generateNavMotif();
  });

  async function copyEmail(feedbackEl) {
    try {
      await navigator.clipboard.writeText('alyssia.mattioni@gmail.com');
      if (feedbackEl) {
        feedbackEl.classList.add('visible');
        setTimeout(() => feedbackEl.classList.remove('visible'), 1600);
      }
    } catch (err) {
      // repli si le presse-papier est bloqué par le navigateur (ex: certains contextes non-https)
      window.prompt('Copie l\'adresse :', 'alyssia.mattioni@gmail.com');
    }
  }

  const copyFeedback = document.getElementById('copyFeedback');
  document.getElementById('mailRow').addEventListener('click', () => copyEmail(copyFeedback));
</script>
